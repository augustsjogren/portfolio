name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: './.github/workflows/build.yml'
    secrets: inherit

  deploy:
    needs: [build]
    name: Deploy site
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    uses: './.github/workflows/deploy.yml'
    secrets: inherit
